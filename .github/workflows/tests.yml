# Tests a chaque envoi et a chaque pull request : tests automatises, compilation
# (qui refuse un media non declare ou un document juridique non versionne),
# audit des dependances, puis tests dans un navigateur (pre-lancement, mobile,
# formulaires, accessibilite).
#
# Securite : permissions en lecture seule, Actions officielles figees sur une
# empreinte de commit, aucun secret utilise.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Tests, compilation et audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Installer les dependances
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tests automatises
        run: npm test

      - name: Compiler le site
        run: npm run build

      - name: Verifier les vulnerabilites connues
        run: npm audit --audit-level=high

  e2e:
    name: Tests dans le navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Installer les dependances
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests dans le navigateur
        run: npm run test:e2e
