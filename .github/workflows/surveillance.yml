# Surveillance de production, chaque heure : pages principales, coherence de
# l'indexation avec la porte de lancement, security.txt, certificats HTTPS et
# sante de l'API (si la variable VITE_API_URL est definie). Un echec envoie la
# notification habituelle de GitHub (e-mail) au proprietaire du depot.
#
# Securite : lecture seule, aucun secret, aucune donnee personnelle lue.
name: Surveillance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verifier le site publie
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Aucune dependance npm : le script n'utilise que Node et shared/.
      - name: Controler la production
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: node scripts/check-production.mjs
